aid: earnipay
name: Earnipay
description: >-
  Earnipay is a Nigerian fintech that operates an NRS/FIRS-compliant e-invoicing
  platform for businesses. As an accredited Nigeria Revenue Service (NRS) and
  NITDA systems integrator, Earnipay lets developers programmatically create
  businesses, manage customers and products, generate FIRS-compliant invoices
  with IRN (Invoice Reference Number) and QR codes, and submit them to the tax
  authority through an Access Point Provider (APP) connection. The public
  Earnipay Invoicing API is an OpenAPI 3.0.0 REST service covering
  authentication, businesses, customers, products, payment details, invoices,
  IRN and QR generation, bank lookup/verification, and team management. It
  authenticates with JWT bearer tokens for user-facing flows and an X-API-Key
  header for third-party integrations. Added to the API Evangelist network as a
  portfolio company of Canaan Partners.
